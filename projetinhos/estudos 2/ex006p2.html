<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício 6 - Parte 2</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        h1 {
            color: #333;
        }
        input[type="number"], input[type="caixa"] {
            margin: 5px;
            padding: 10px;
            width: 200px;
        }
        input[type="button"] {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        input[type="button"]:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h1>Somando Valores</h1>
    <input type="number"  id="txtn1">
    <input type="number"  id="txtn2">  
    <input type="button" value="Somar" onclick="somar()">
    <div id="res">Resultado</div>
    <script>
        function somar() {
           let tn1 = window.document.querySelector(`#txtn1`)
           let tn2 = window.document.querySelector(`#txtn1`)
           let res = window.document.querySelector(`#res`)
           let n1 = Number(tn1.value)
           let n2 = Number(tn2.value)
           let s = n1 + n2
           res.innerHTML = `a soma entre ${n1} + ${n2} é = ${s}`
           
        }
    </script>
</html>
